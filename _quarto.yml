project:
  type: book
  output-dir: _book

lang: pt-BR
language: _language-pt.yml

book:
  title: "Personalidade"
  subtitle: "Uma Breve Introdução"
  # Sem site-url o Quarto não gera sitemap nem robots.txt, e o canonical
  # não tem como ser montado. Sem barra final: a barra dispara um defeito
  # conhecido do Quarto que produz barra dupla no canonical.
  site-url: "https://henriquealvarenga.com/personalidade"
  edition: "2ª edição"                       # metadado Pandoc — vai pro EPUB/citações
  author:
    - name: "Henrique Alvarenga da Silva"
      orcid: 0000-0001-9799-5240
      email: henriquealvarenga@ufsj.edu.br
      affiliations:
        - name: Universidade Federal de São João del-Rei (UFSJ)
          department: Curso de Medicina
  # Data de publicação FIXA, escolhida pelo autor. Não usar `today`: com ele,
  # cada render (local ou no CI) troca a data exibida para a do dia.
  date: "2026-10-03"
  date-format: "MMMM [de] YYYY"

  description: |
    Livro-texto sobre personalidade para o ensino de psicopatologia, com
    capítulos clínicos sobre traços, transtornos, epidemiologia, tratamento
    e big data. Em apêndice opcional, o ensaio filosófico-literário
    'A descoberta às avessas' problematiza o próprio conceito.
  keyword: "personalidade, psicopatologia, transtornos de personalidade, Big Five, DSM-5, psiquiatria, educação médica, Fernando Pessoa, Walt Whitman"
  cover-image: images/capa.jpg
  favicon: images/favicon.png
  image: images/capa.jpg                  # thumbnail no sidebar e em previews sociais

  # Sem repo-url: o repositório é privado, e os links que o Quarto gera a
  # partir dele (ícone do GitHub, "Reportar um problema") davam 404 para
  # os leitores. O contato passa a ser por e-mail (ícone em sidebar.tools).
  search: true
  sharing: [twitter, facebook, linkedin]
  page-navigation: true
  back-to-top-navigation: true

  page-footer:
    center: |
      Dr. Henrique Alvarenga da Silva · Médico Psiquiatra · CRM-MG 31.778 · RQE 8381<br>
      [henriquealvarenga.com](https://henriquealvarenga.com)

  sidebar:
    style: docked
    collapse-level: 1
    border: true
    # Ícones no topo do menu lateral. Tem de ficar aqui, e não em book.tools:
    # o Quarto aceita book.tools no schema, mas só lê sidebar.tools.
    tools:
      - icon: envelope
        href: mailto:henriquealvarenga@ufsj.edu.br
        text: "Sugestões e correções"

  chapters:
    - index.qmd
    - part: "Parte I — Fundamentos clínicos"
      chapters:
        - capitulos/parte-1-fundamentos/01-introducao.qmd
        - capitulos/parte-1-fundamentos/02-construcao-da-personalidade.qmd
        - capitulos/parte-1-fundamentos/03-periodos-sensiveis.qmd
        - capitulos/parte-1-fundamentos/04-plasticidade.qmd
        - capitulos/parte-1-fundamentos/05-personalidade-e-saude.qmd
    - part: "Parte II — Taxonomia, traços e transtornos"
      chapters:
        - capitulos/parte-2-taxonomia/06-taxonomia.qmd
        - capitulos/parte-2-taxonomia/07-tracos.qmd
        - capitulos/parte-2-taxonomia/08-transtornos.qmd
        - capitulos/parte-2-taxonomia/09-epidemiologia.qmd
        - capitulos/parte-2-taxonomia/10-tratamento.qmd
    - part: "Parte III — Personalidade na era digital"
      chapters:
        - capitulos/parte-3-era-digital/11-big-data.qmd
    - part: "Parte IV — A personalidade na cultura: cinema e literatura"
      chapters:
        - capitulos/parte-4-cultura/12-personalidade-como-mascara.qmd
        - capitulos/parte-4-cultura/13-personalidade-como-narrativa.qmd
        - capitulos/parte-4-cultura/14-personalidade-no-transtorno.qmd
    - part: "Parte V — Atividades"
      chapters:
        # ── Atividade 1: Casos clínicos (versão para leitura, diagnóstico oculto) ──
        # Nomes neutros (caso-a…caso-i) para o endereço da página não revelar
        # o diagnóstico. Os scripts correspondentes estão no Apêndice C.
        - capitulos/parte-5-atividades/atividade-1-casos/00-introducao.qmd
        - capitulos/parte-5-atividades/atividade-1-casos/caso-a.qmd   # TP Dependente
        - capitulos/parte-5-atividades/atividade-1-casos/caso-b.qmd   # TP Esquizotípica
        - capitulos/parte-5-atividades/atividade-1-casos/caso-c.qmd   # TP Obsessivo-Compulsiva
        - capitulos/parte-5-atividades/atividade-1-casos/caso-d.qmd   # TP Antissocial
        - capitulos/parte-5-atividades/atividade-1-casos/caso-e.qmd   # TP Histriônica
        - capitulos/parte-5-atividades/atividade-1-casos/caso-f.qmd   # TP Narcisista
        - capitulos/parte-5-atividades/atividade-1-casos/caso-g.qmd   # TP Evitativa
        - capitulos/parte-5-atividades/atividade-1-casos/caso-h.qmd   # TP Paranoide
        - capitulos/parte-5-atividades/atividade-1-casos/caso-i.qmd   # TP Borderline
        # Falta: TP Esquizoide (cluster A) — adicionar como Caso J quando pronto.
        # ── Atividade 2: Quatro visões da personalidade × IAs ──
        - capitulos/parte-5-atividades/atividade-2-visoes-ia/01-leitura-preparatoria.qmd
        - capitulos/parte-5-atividades/atividade-2-visoes-ia/02-atividade.qmd
    - creditos.qmd
    - references.qmd

  appendices:
    - apendices/descoberta-as-avessas.qmd
    - apendices/critica-interdisciplinar.qmd
    # ── Apêndice C: scripts para simulação em vídeo (material do professor) ──
    # Cada script usa number-sections: false, para não ganhar letra própria
    # de apêndice (evita "Apêndice D — Script A").
    - apendices/scripts/00-introducao.qmd
    - apendices/scripts/dependente.qmd      # Script A — TP Dependente
    - apendices/scripts/esquizotipica.qmd   # Script B — TP Esquizotípica
    - apendices/scripts/obsessivo.qmd       # Script C — TP Obsessivo-Compulsiva
    - apendices/scripts/antissocial.qmd     # Script D — TP Antissocial
    - apendices/scripts/histrionica.qmd     # Script E — TP Histriônica
    - apendices/scripts/narcisista.qmd      # Script F — TP Narcisista
    - apendices/scripts/esquiva.qmd         # Script G — TP Evitativa
    - apendices/scripts/paranoide.qmd       # Script H — TP Paranoide
    - apendices/scripts/borderline.qmd      # Script I — TP Borderline

# =========================================================================
# Bibliografia — Nature Publishing Group - NLM/Vancouver (numérico, número
# sobrescrito), processado pelo Citeproc do Pandoc. O CSL tem ajustes locais
# comentados no arquivo (língua padrão pt-BR; ordinal feminino; volume
# ausente; espaço antes da URL e do ano de acesso; edição nos capítulos).
# =========================================================================
bibliography: references/references.bib
csl: references/csl_styles/nature-publishing-group-vancouver.csl
citeproc: true
link-citations: true
link-bibliography: true
reference-section-title: "Referências"

# =========================================================================
# Formatos de saída
# =========================================================================
format:
  html:
    theme:
      - cosmo
      - theme-editorial.scss
    css: styles.css
    canonical-url: true
    include-in-header:
      - file: _includes/autor.html
      - file: _includes/rodape.html
      - file: _includes/referencias-locais.html
    fontsize: 1.05em
    linestretch: 1.65
    mainfont: "Inter"
    monofont: "JetBrains Mono"
    toc: true
    toc-depth: 3
    toc-title: "Nesta página"
    number-sections: true
    number-depth: 2
    code-fold: false
    code-tools: false
    smooth-scroll: true
    citations-hover: true
    crossrefs-hover: true
    footnotes-hover: true
    callout-appearance: simple
    fig-cap-location: bottom
    tbl-cap-location: top
    anchor-sections: true
    highlight-style: github

  # EPUB intencionalmente removido em 2026-05-23.
  # Motivo: rodar `quarto render --to epub` após `quarto render --to html`
  # limpava o _book/, deixando só o .epub no artifact e quebrando o deploy.
  # Para regenerar EPUB no futuro, prefira `quarto render` (sem --to) e
  # declare ambos formatos no _quarto.yml.

  # PDF intencionalmente DESABILITADO no CI.
  # Para gerar PDF localmente:  quarto render --to pdf
  # pdf:
  #   documentclass: scrbook
  #   papersize: a5
  #   geometry:
  #     - inner=2.5cm
  #     - outer=2cm
  #     - top=2cm
  #     - bottom=2cm
  #   fontsize: 11pt
  #   colorlinks: true
  #   biblio-style: abnt
  #   cite-method: biblatex
  #   biblatexoptions: [style=abnt, backend=biber]

# =========================================================================
# Execução de código (não há código executável por enquanto;
# placeholder para se houver futuras análises em R/Python).
# =========================================================================
execute:
  freeze: auto
  echo: false
  warning: false

